<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VERA — Mất kết nối</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 20%, #0b1e3d 0%, #040d1d 55%, #000000 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(360px, 100%);
      padding: 28px 22px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.2);
      text-align: center;
      box-shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.75);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 17px;
      background: linear-gradient(145deg, #0b1c38, #02060d);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 800;
    }
    p {
      margin: 0 0 22px;
      font-size: 13.5px;
      line-height: 1.55;
      color: #94a3b8;
    }
    button {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">V</div>
    <h1>Không có kết nối mạng</h1>
    <p>Vui lòng kiểm tra lại Wi-Fi hoặc dữ liệu di động 4G/5G rồi thử kết nối lại máy chủ VERA.</p>
    <button onclick="location.replace('https://veratiez.netlify.app')">Thử kết nối lại</button>
  </div>
</body>
</html>
