<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VERA</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #040d1d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .mark {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(145deg, #0b1c38, #02060d);
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 900;
      color: #ffffff;
      box-shadow: 0 18px 40px -12px rgba(16, 185, 129, 0.45);
    }
    .txt {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="mark">V</div>
    <div class="txt">Đang khởi động VERA...</div>
  </div>
</body>
</html>
